name: IaC Security

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/**'
      - 'apps/**/Dockerfile'
      - 'Dockerfile'
      - 'docker-compose.yml'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/**'
      - 'apps/**/Dockerfile'
      - 'Dockerfile'
      - 'docker-compose.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  checkov:
    # Self-hosted on dev-ci. See ci.yml for context.
    runs-on: [self-hosted, dev-ci]
    steps:
      - uses: actions/checkout@v4

      - name: Checkov scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: dockerfile,github_actions,secrets
          quiet: true
          soft_fail: false

  trivy-config:
    runs-on: [self-hosted, dev-ci]
    steps:
      - uses: actions/checkout@v4

      - name: Trivy IaC config scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: config
          hide-progress: true
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'
          scan-ref: .
